[Service]
# Palworld's Linux shipping build emits its useful game/network log to
# stdout/stderr. Keep journald as the primary collector while also retaining
# a plain file for incident capture and post-disconnect analysis.
StandardOutput=append:/srv/palworld/server/Pal/Saved/Logs/Pal.log
StandardError=append:/srv/palworld/server/Pal/Saved/Logs/Pal.log
