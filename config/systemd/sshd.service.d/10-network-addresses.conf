[Unit]
# The LAN reflection service adds the production aliases (including
# 192.168.50.85) after NetworkManager brings up the base DHCP connection.
# Start sshd after those addresses exist so ListenAddress does not fall back
# to loopback when the machine boots.
Wants=network-online.target dune-lan-reflection.service
After=network-online.target dune-lan-reflection.service
